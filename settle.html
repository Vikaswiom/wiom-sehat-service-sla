<!doctype html><html lang="hi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>साइकिल का हिसाब — सेहत गारंटी</title>
<style>
/* Design system inherited verbatim from wiom-mbg-kamai-kavach/settle.html —
   that file is the model and is NOT modified; this is the Sehat-MG twin. */
:root{--maroon:#3f2a44;--purple:#6D17CE;--purpbg:#F4EBFC;--pill:#EBDDFB;--green:#008043;--green-bg:#E6F6EE;
--amber:#B85C00;--amberbar:#E08A1E;--amber-bg:#FBF1DD;--amberline:#F0DBAF;--red:#D9202F;
--text:#181022;--t2:#6b6478;--t3:#a8a2b4;--card:#fff;--screen:#F7F5FA;--line:#ECE7F2;--stroke2:#DED8EA;}
*{box-sizing:border-box;margin:0;font-family:"Noto Sans Devanagari","Nirmala UI","Segoe UI",system-ui,sans-serif;}
html,body{background:var(--screen);overflow-x:hidden;}
.wrap{min-height:100vh;background:var(--screen);color:var(--text);max-width:430px;margin:0 auto;line-height:1.5;overflow-x:hidden;}
.hdr{background:var(--maroon);color:#fff;padding:13px 15px;display:flex;align-items:center;gap:11px;}
.hdr .t{font-size:15.5px;font-weight:700;flex:1;}
.subhdr{background:var(--maroon);color:#e8dcec;padding:0 15px 11px;font-size:12px;font-weight:600;}
.body{padding:13px;display:flex;flex-direction:column;gap:11px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;}
.k{font-size:12px;color:var(--t2);font-weight:600;}
.earn-amt{font-size:30px;font-weight:800;letter-spacing:-1px;margin:5px 0 3px;font-variant-numeric:tabular-nums;}
.earn-sub{font-size:11.5px;color:var(--green);font-weight:700;line-height:1.45;}
.earn-sub.mut{color:var(--t2);}
.wyh-top{display:flex;align-items:baseline;gap:7px;margin:5px 0 2px;}
.wyh-pct{font-size:31px;font-weight:800;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;}
.wyh-need80{font-size:12.5px;color:var(--t3);font-weight:700;}
.bar{position:relative;height:11px;background:#EDEAF2;border-radius:6px;margin:12px 0 4px;}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;}
.bar .mk{position:absolute;left:80%;top:-4px;bottom:-4px;width:2px;background:#2a2130;}
.wyh-need{font-size:14px;font-weight:800;margin-top:9px;}
.wyh-line{font-size:11.5px;color:var(--t2);line-height:1.5;margin-top:3px;}
.f-green .wyh-pct{color:var(--green)}.f-green .fill{background:var(--green)}.f-green .wyh-need{color:var(--green)}
.f-amber .wyh-pct{color:var(--amber)}.f-amber .fill{background:var(--amberbar)}.f-amber .wyh-need{color:var(--amber)}
.f-red .wyh-pct{color:var(--red)}.f-red .fill{background:var(--red)}.f-red .wyh-need{color:var(--red)}

/* settlement card — themed by outcome (ok = paid · applied = info/held · na = no bonus) */
.settle{border-radius:16px;padding:15px;border:1px solid;}
.settle .ph{font-size:12.5px;font-weight:800;}
.settle .title{font-size:16.5px;font-weight:800;letter-spacing:-.3px;margin:4px 0 6px;line-height:1.3;}
.settle .bd{font-size:12.5px;line-height:1.6;font-weight:500;}
.settle .rows{margin-top:12px;background:#fff;border-radius:11px;padding:4px 12px;}
.settle .row{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 0;font-size:12.5px;border-top:1px solid var(--line);}
.settle .row:first-child{border-top:0;}
.settle .row .lab{color:var(--t2);font-weight:600;}
.settle .row .amt{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;}
.settle .row.plus .amt{color:var(--purple);}
.settle .row.total{border-top:1.5px solid var(--stroke2);}
.settle .row.total .lab{color:var(--text);font-weight:800;}
.settle .row.total .amt{font-size:18px;font-weight:800;letter-spacing:-.5px;}
.settle.ok{background:var(--green-bg);border-color:#BFE6D2;}
.settle.ok .ph,.settle.ok .title{color:var(--green);} .settle.ok .row.total .amt{color:var(--green);}
.settle.applied{background:var(--purpbg);border-color:#e6d6fa;}
.settle.applied .ph,.settle.applied .title{color:var(--purple);} .settle.applied .row.total .amt{color:var(--purple);}
.settle.na{background:var(--amber-bg);border-color:var(--amberline);}
.settle.na .ph,.settle.na .title{color:var(--amber);} .settle.na .row.total .amt{color:var(--amber);}
.settle .bd b{color:var(--text);}
.settle .sb{font-size:11.5px;font-weight:800;margin:11px 0 4px;}
.settle .li{font-size:11.5px;line-height:1.7;color:var(--t2);}
/* नई-साइकिल card */
.settle.days{background:#F1EEF6;border-color:var(--stroke2);}
.settle.days .ph,.settle.days .title{color:var(--maroon);} .settle.days .row.total .amt{color:var(--maroon);}
.settle.ended{padding:0;overflow:hidden;}
.settle.ended>summary{list-style:none;cursor:pointer;padding:14px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;font-weight:800;color:var(--purple);line-height:1.35;letter-spacing:-.3px;margin:0;}
.settle.ended>summary::-webkit-details-marker{display:none;}
.settle.ended>summary .chev{flex:none;font-size:14px;line-height:1;transition:transform .2s;}
.settle.ended[open]>summary .chev{transform:rotate(180deg);}
.settle.ended>.bd{padding:0 15px 15px;color:var(--text);}
.days-next{font-size:11.5px;color:var(--purple);font-weight:700;line-height:1.5;margin-top:11px;}
.dlbtn{display:block;width:100%;margin:11px 0 0;padding:13px 14px;border:none;border-radius:12px;background:var(--purple);
  color:#fff;text-align:center;text-decoration:none;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;
  box-shadow:0 2px 8px rgba(109,23,206,.22);-webkit-tap-highlight-color:transparent;}
.dlbtn:active{transform:translateY(1px);}

.foot{font-size:11px;color:var(--t3);text-align:center;padding:2px 6px 16px;line-height:1.5;}

/* demo switcher (only with ?demo=1 or no cspId) */
.demo{max-width:430px;margin:0 auto;padding:10px 13px 0;display:flex;flex-wrap:wrap;gap:6px;}
.demo button{font-size:11px;font-weight:700;padding:6px 10px;border-radius:999px;cursor:pointer;
  background:#fff;color:var(--t2);border:1px solid var(--stroke2);}
.demo button[aria-pressed="true"]{background:var(--maroon);border-color:var(--maroon);color:#fff;}
.demo .note{width:100%;font-size:11px;color:var(--t3);padding-top:2px;}
.skel{color:var(--t3);font-size:12.5px;font-weight:600;text-align:center;padding:34px 14px;line-height:1.7;}
</style></head>
<body>
<div class="demo" id="demo" hidden></div>
<div class="wrap"><div class="hdr"><span class="t">सेहत गारंटी</span></div>
  <div class="subhdr" id="subhdr">साइकिल का हिसाब</div>
  <div class="body" id="body"><div class="skel">हिसाब लाया जा रहा है…</div></div>
</div>

<script>
/* ── Sehat MG cycle-end settlement (report card) ─────────────────────────────
   The twin of wiom-mbg-kamai-kavach/settle.html for the Sehat (Quality) MG.
   For a SETTLED cycle the OFFICIAL payout table (CYCLE1 below) is the single
   source of truth — never the rolling estimate:
     · gate  — Track A: 15-Aug cycle-close Optical reading ≥ 80.
               Track B: SLA on complaints OPENED IN THE CYCLE (`ic`) ≥ 80 — the
               60-day rolling number can sit below 80 while the CSP still wins
               (3 of the 16 winners did exactly that).
     · payout — pro-rata by opt-in date: days enrolled ÷ 31 × ₹10,000.
     · not in the table = not enrolled this cycle → info card, no ₹ promised.
   Comms groups from the run flavor the ₹0 copy: g3 "at the door" (rolling
   within 5 of 80) · g4 improved-not-paid (praise the climb) · g5 held/declined.
   For a cycle with no table yet (next cycle until its run lands), the screen
   falls back to the rolling estimate and says the final list confirms payout. */
var PROXY_URL = "";
var DATA_URL  = "https://vikaswiom.github.io/wiom-sehat-mg/data.json";  /* cross-repo fallback */
var TARGET = 80, SPLIT = 75, PRIZE = 10000;
var DAILY = {A:'https://vikaswiom.github.io/wiom-sehat-mg/',
             B:'https://vikaswiom.github.io/wiom-sehat-service-sla/'};

/* ── OFFICIAL FINAL SETTLEMENT — 16 Aug–15 Sept 2026, the program's LAST cycle.
   21 eligible CSPs held ≥80% → full ₹10,000 each (30/30 days, no pro-rata):
   10 on Optical Power (Track A) + 11 on Service SLA (Track B). Every other CSP =
   not in the final eligible list → ₹0, no deduction. Per row: c track · g=1 paid ·
   r final 15-Sep reading % · amt payout · j/d enrolment date & eligible days.       */
var CYCLE1 = {
  ce: Date.UTC(2026, 8, 15),   /* the cycle-end this table settles: 15 Sept 2026 */
  data: {
  /* Track A — Optical Power (10) */
  a0b8z2:{c:'A',g:1,r:100.0,amt:10000,j:'17 जुलाई',d:30},
  a0b7d8:{c:'A',g:1,r:100.0,amt:10000,j:'19 जुलाई',d:30},
  a0c0g3:{c:'A',g:1,r:92.8,amt:10000,j:'18 जुलाई',d:30},
  a0c0a4:{c:'A',g:1,r:90.8,amt:10000,j:'16 जुलाई',d:30},
  a0c0f1:{c:'A',g:1,r:86.2,amt:10000,j:'16 जुलाई',d:30},
  a0b8s8:{c:'A',g:1,r:85.9,amt:10000,j:'16 जुलाई',d:30},
  a0b7h7:{c:'A',g:1,r:83.4,amt:10000,j:'17 जुलाई',d:30},
  a0b9t8:{c:'A',g:1,r:81.8,amt:10000,j:'16 जुलाई',d:30},
  a0b7e1:{c:'A',g:1,r:81.0,amt:10000,j:'16 जुलाई',d:30},
  a0b6p4:{c:'A',g:1,r:80.6,amt:10000,j:'19 जुलाई',d:30},
  /* Track B — Service SLA (11) */
  a0b5w2:{c:'B',g:1,r:100.0,amt:10000,j:'16 जुलाई',d:30},
  a0b6e9:{c:'B',g:1,r:98.1,amt:10000,j:'16 जुलाई',d:30},
  a0b7g9:{c:'B',g:1,r:94.1,amt:10000,j:'17 जुलाई',d:30},
  a0b9h3:{c:'B',g:1,r:92.0,amt:10000,j:'16 जुलाई',d:30},
  a0b6j9:{c:'B',g:1,r:90.9,amt:10000,j:'16 जुलाई',d:30},
  a0c0b8:{c:'B',g:1,r:90.6,amt:10000,j:'16 जुलाई',d:30},
  a0b6o9:{c:'B',g:1,r:86.0,amt:10000,j:'21 जुलाई',d:30},
  a0b9m3:{c:'B',g:1,r:83.6,amt:10000,j:'18 जुलाई',d:30},
  a0a7g1:{c:'B',g:1,r:82.7,amt:10000,j:'16 जुलाई',d:30},
  a0b9z8:{c:'B',g:1,r:81.2,amt:10000,j:'16 जुलाई',d:30},
  a0b8t5:{c:'B',g:1,r:81.0,amt:10000,j:'16 जुलाई',d:30}
}};

/* CleverTap in-app unit support: substituted when this HTML is pasted into a
   campaign; stays literal (ignored — fails ID_RE) on the hosted page, and a
   ?cspId= in the URL always wins over it. */
try{ window.CSP_ID = window.CSP_ID || '{{ Profile.cspId | default: "a" }}'; }catch(e){}

/* same multi-shape id reader as the daily page — query / hash / path / webview / session */
var ID_RE = /^[a-z][a-z0-9]{4,9}$/;
function cspIdFromUrl(){
  var q = new URLSearchParams(location.search);
  var id = q.get('cspId') || q.get('cspid') || q.get('csp_id') || q.get('id') || '';
  if (!id && location.hash){
    var h = location.hash.slice(1);
    id = h.indexOf('=') > -1 ? (new URLSearchParams(h).get('cspId') || '') : h;
  }
  if (!id){
    try{
      id = window.CSP_ID || window.cspId || '';
      if (!id && window.Android && typeof window.Android.getCspId === 'function') id = window.Android.getCspId();
    }catch(e){}
  }
  id = String(id || '').trim().toLowerCase();
  try{
    if (ID_RE.test(id)) sessionStorage.setItem('sehat_csp', id);
    else                id = (sessionStorage.getItem('sehat_csp') || '').toLowerCase();
  }catch(e){}
  return ID_RE.test(id) ? id : '';
}
function inr(n){ return Number(n).toLocaleString('en-IN'); }

/* Program ENDED — this screen is FROZEN to the final settled cycle: 16 Aug–15 Sept
   2026, paid 16 Sept. It no longer rolls forward with the calendar. */
var HIm = ['जनवरी','फ़रवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'];
function fmtD(t){ var d = new Date(t); return d.getUTCDate() + ' ' + HIm[d.getUTCMonth()]; }
function cycle(){
  var ist = new Date(Date.now() + 330*60000);
  var todayUTC = Date.UTC(ist.getUTCFullYear(), ist.getUTCMonth(), ist.getUTCDate());
  return {
    cs:  Date.UTC(2026, 7, 16),   /* 16 Aug 2026 — final cycle start */
    ce:  Date.UTC(2026, 8, 15),   /* 15 Sept 2026 — final cycle end (matches CYCLE1.ce) */
    pay: Date.UTC(2026, 8, 16),   /* paid 16 Sept 2026 */
    payToday: todayUTC === Date.UTC(2026, 8, 16)
  };
}

/* display %: official readings keep their decimal; estimates never round across the gate */
function fmtOff(v){ return v % 1 ? v.toFixed(1) : String(v); }
function fmtPct(v){
  if (v == null) return '—';
  var r = Math.round(v);
  return ((r === TARGET || r === SPLIT) && v < r) ? v.toFixed(1) : String(r);
}

function compute(d){
  var c   = cycle();
  var op  = d.all  ? d.ok  / d.all  * 100 : null;
  var sla = d.stot ? d.sok / d.stot * 100 : null;
  /* the official table decides the settled cycle it covers */
  var rec = d.rec || ((d.id && c.ce === CYCLE1.ce) ? CYCLE1.data[d.id] : null) || null;
  var tr, val, kase, official = false;
  if (rec){
    official = true;
    tr   = rec.c;
    val  = tr === 'B' && rec.ic != null ? rec.ic : rec.r;    /* the number the gate used */
    kase = rec.amt > 0 ? 'paid' : rec.g === 3 ? 'door' : rec.g === 4 ? 'improved' : 'held';
  } else if (d.rec === undefined && d.id && c.ce === CYCLE1.ce){
    tr   = d.tr === 'A' || d.tr === 'B' || d.tr === 'U' ? d.tr
         : d.op0 != null ? (d.op0 < SPLIT ? 'A' : 'B') : 'U';
    val  = tr === 'A' ? op : sla;
    kase = 'unenrolled';                                     /* known CSP, not in the run */
  } else {
    /* a cycle with no official table yet — rolling estimate, payout confirmed by the run */
    tr = d.tr;
    if (tr !== 'A' && tr !== 'B' && tr !== 'U')
      tr = d.op0 != null ? (d.op0 < SPLIT ? 'A' : 'B') : (op != null ? (op < SPLIT ? 'A' : 'B') : 'U');
    val = tr === 'A' ? op : sla;
    kase = tr === 'A'
      ? (val == null ? 'nodata' : val >= TARGET ? 'pass' : val >= SPLIT ? 'near' : 'miss')
      : (val == null ? 'none'   : val >= TARGET ? 'pass' : val >= SPLIT ? 'near' : 'miss');
  }
  return {
    tr: tr, op: op, sla: sla, val: val, kase: kase, rec: rec, official: official,
    won: kase === 'paid' || kase === 'pass' || kase === 'none',
    gap: val == null ? null : Math.max(1, Math.ceil(TARGET - val)),
    band: val == null ? 'green' : val >= TARGET ? 'green' : val >= SPLIT ? 'amber' : 'red',
    cyc: c
  };
}

function rowsHTML(rows){
  return '<div class="rows">'+rows.map(function(r){
    return '<div class="row'+(r[2]||'')+'"><span class="lab">'+r[0]+'</span><span class="amt">'+r[1]+'</span></div>';
  }).join('')+'</div>';
}

function render(d){
  var m = compute(d), c = m.cyc, R = m.rec;
  var A = m.tr === 'A';
  var metric = A ? 'ऑप्टिकल पॉवर' : 'समय पर समाधान';
  var pct = m.official ? fmtOff(m.val) : fmtPct(m.val);
  var amt = R && R.amt > 0 ? R.amt : PRIZE;
  var payLine = c.payToday ? 'आज ही आपके खाते में' : fmtD(c.pay) + ' को आपके खाते में';
  var mv = R ? Math.round((R.r - R.e) * 10) / 10 : null;      /* rolling movement over the cycle */
  /* movement shows only when it is a positive story — a flat or falling line is never printed */
  var mvLine = R && mv > 0 ? '16 जुलाई: ' + fmtOff(R.e) + '% → 15 अगस्त: ' + fmtOff(R.r) + '% — <b>+' + fmtOff(mv) + ' सुधार</b> 📈' : '';

  document.getElementById('subhdr').textContent = fmtD(c.cs) + ' – ' + fmtD(c.ce) + ' की साइकिल का हिसाब';

  if (m.kase === 'nodata'){
    document.getElementById('body').innerHTML =
      '<div class="skel">इस साइकिल आपके नेटवर्क से टेलीमेट्री नहीं मिली,<br>इसलिए हिसाब अभी तैयार नहीं है.<br>हेल्पलाइन पर कॉल कीजिए.</div>';
    return;
  }

  /* hero — what landed in the wallet */
  var heroHTML;
  if (m.kase === 'unenrolled'){
    heroHTML = '<div class="card"><div class="k">इस आख़िरी साइकिल का सेहत बोनस</div>'+
      '<div class="earn-amt">₹0</div>'+
      '<div class="earn-sub mut">आपका '+metric+' 80% से कम रहा — कोई कटौती नहीं</div></div>';
  } else if (m.won){
    heroHTML = '<div class="card"><div class="k">आपकी आख़िरी सेहत गारंटी</div>'+
      '<div class="earn-amt">₹'+inr(amt)+'</div>'+
      '<div class="earn-sub">'+payLine+(R && R.amt < PRIZE ? ' · '+R.d+'/31 दिन के हिसाब से' : ' · इंस्टॉल-सर्विस कमाई के ऊपर')+'</div></div>';
  } else {
    heroHTML = '<div class="card"><div class="k">इस साइकिल का सेहत बोनस</div>'+
      '<div class="earn-amt">₹0</div>'+
      '<div class="earn-sub mut">कोई कटौती नहीं — इंस्टॉल और सर्विस की कमाई पूरी आपकी</div></div>';
  }

  /* standing — the number the gate used (official) or the rolling estimate */
  var gateLab = m.official && !A && R.ic != null ? 'समय पर समाधान — साइकिल में आई शिकायतों पर' : metric;
  var basis = m.official
    ? gateLab + ' · फ़ाइनल हिसाब की रीडिंग' +
      (!A && R.ic != null && R.r < TARGET && R.amt > 0 ? '<br>रोज़ वाला 60-दिन का नंबर ('+fmtOff(R.r)+'%) अलग दिखता था — गिनती साइकिल की शिकायतों की हुई' : '') +
      (mvLine ? '<br>' + mvLine : '')
    : (A ? (d.all ? inr(d.all)+' पिंग में से '+inr(d.ok)+' सही = '+pct+'% · आख़िरी 15 दिन का औसत' : '')
         : (d.stot ? d.stot+' शिकायत · '+d.sok+' समय से बंद, '+((d.stot||0)-(d.sok||0))+' देर से = '+pct+'%'
                   : 'पूरी साइकिल में एक भी सर्विस शिकायत नहीं आई'));
  var need = m.val == null            ? 'गिनने को शिकायत ही नहीं थी'
           : m.won                    ? '✓ 80% पार — वादा पूरा'
           : m.kase === 'unenrolled'  ? 'ये सिर्फ़ आपकी जानकारी के लिए है'
           : m.gap <= 5               ? 'बस '+m.gap+'% रह गया'
           :                            '80% से '+m.gap+'% दूर रह गया';
  var standHTML = m.kase === 'unenrolled' ? ''
    : m.val == null
    ? '<div class="card f-green"><div class="k">आप कहाँ बंद हुए</div>'+
        '<div class="wyh-need" style="margin-top:6px">'+need+'</div>'+
        '<div class="wyh-line">'+basis+'</div></div>'
    : '<div class="card f-'+m.band+'"><div class="k">आप कहाँ बंद हुए</div>'+
        '<div class="wyh-top"><span class="wyh-pct">'+pct+'%</span>'+
          '<span class="wyh-need80">/ 80% या ऊपर चाहिए · '+metric+'</span></div>'+
        '<div class="bar"><div class="fill" style="width:'+Math.min(100, m.val)+'%"></div><div class="mk"></div></div>'+

  document.getElementById('body').innerHTML =

  try{

/* ── data — local data.json first, cross-repo fallback (same contract as the daily tile) ── */
async function getCsp(){
  var id = cspIdFromUrl();
  if (!id) return null;
  if (PROXY_URL){
    try{
      var sep = PROXY_URL.indexOf('?') > -1 ? '&' : '?';
      var r = await fetch(PROXY_URL + sep + 'cspId=' + encodeURIComponent(id), {cache:'no-store'});
      var j = await r.json();
      if (j && (j.all !== undefined || j.stot !== undefined)) { j.id = id; return j; }
    }catch(e){}
  }
  for (var u = 0; u < 2; u++){
    try{
      var s = await fetch(u === 0 ? 'data.json' : DATA_URL, {cache:'no-store'});
      var D = (await s.json()).data || {};
      return D[id] ? Object.assign(D[id], {id:id}) : null;
    }catch(e){}
  }
  return null;
}

function mountDemo(){
  var el = document.getElementById('demo'); el.hidden = false;
  Object.keys(DEMO).forEach(function(k){
    var b = document.createElement('button'); b.type = 'button'; b.textContent = DEMO[k].label;
    b.onclick = function(){
      Array.prototype.forEach.call(el.querySelectorAll('button'), function(x){ x.setAttribute('aria-pressed','false'); });
      b.setAttribute('aria-pressed','true'); render(DEMO[k]);
    };
    el.appendChild(b);
  });
  var n = document.createElement('div'); n.className = 'note';
  n.textContent = 'हर एनरोल्ड सीएसपी इनमें से एक पर बंद होता है';
  el.appendChild(n);
  el.querySelector('button').click();
}

(async function(){
  var q = new URLSearchParams(location.search);
  if (q.get('case') && DEMO[q.get('case')]){ render(DEMO[q.get('case')]); return; }
  var id = cspIdFromUrl();
  if (!id || q.get('demo') === '1'){ mountDemo(); return; }
  var d = await getCsp();
  /* an enrolled CSP renders from the official table even if data.json misses them */
  if (!d && id && cycle().ce === CYCLE1.ce && CYCLE1.data[id]) d = {id: id};
  if (!d){
    document.getElementById('body').innerHTML =
      '<div class="skel">'+(id
        ? 'इस साइकिल का हिसाब अभी तैयार नहीं है.<br>ऐप में दोबारा खोलें, या हेल्पलाइन पर कॉल करें.'

    return;
  }
  render(d);
})();
